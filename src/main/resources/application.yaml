server:
  port: 3333
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/TaskMaxing}
    username: ${DB_USERNAME:TaskMaxing}
    password: ${DB_PASSWORD:TaskMaxing}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# JWT secret artıq koddan deyil, buradan (və ya JWT_SECRET env dəyişənindən) gəlir.
# Prod-da mütləq JWT_SECRET env dəyişəni təyin et!
jwt:
  secret: ${JWT_SECRET:mySuperSecretKeyForYaxsiComProjectWhichIsVeryLongAndSecure}
